name: TypeScript and lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Room reconnect regression tests
        run: node --experimental-strip-types --test scripts/room-reconnect.test.mjs scripts/server-time.test.mjs scripts/coalesced-task.test.mjs
      - name: Gameplay regression tests
        run: node --experimental-strip-types --test scripts/gameplay-ui.test.mjs scripts/gameplay-database.test.mjs scripts/pong-timeline.test.mjs
      - name: Nickname onboarding tests
        run: node --experimental-strip-types --test scripts/nickname-onboarding.test.mjs
      - name: Player management tests
        run: node --experimental-strip-types --test scripts/player-management.test.mjs scripts/player-management-database.test.mjs
      - name: Short results recap tests
        run: node --experimental-strip-types --test scripts/results-recap.test.mjs
      - name: Expo lint
        run: npx expo lint
